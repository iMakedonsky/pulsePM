<section class="panel">
  <h2>Owner:</h2>
    <a href="{% url 'profile' organization_id=owner.organization_id member_id=owner.id %}">
        {{ owner }}
    </a>
    <h2 style="margin-top: 20px">Members:</h2>
  {% if member_list %}
    <ul class="list">
      {% for member in member_list %}
        <li>
          <a
            href="{% url 'profile' organization_id=member.organization_id member_id=member.id %}">{{ member }}</a>
        </li>
          <form  method="post" action="{% url 'member_delete' member_id=member.id organization_id=member.organization_id %}">
              {% csrf_token %}
              <button type="submit">X</button>
          </form>
      {% endfor %}
    </ul>
  {% else %}
    <p>No members in this organization yet</p>
  {% endif %}
</section>
