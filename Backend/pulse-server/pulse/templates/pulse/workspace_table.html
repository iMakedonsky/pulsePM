            <section class="panel">
                <h2>Workspaces</h2>
                <div>
                    {% include 'forms/base_form.html' with form=workspace_form %}
                </div>
                {% if workspace_list %}
                    <ul class="list">
                        {% for workspace in workspace_list %}
                            <li>

                                <a href="{% url 'pulse:workspace' workspace.id %}">{{ workspace }}</a>

                                <form  method="post" action="{% url 'pulse:workspace_delete' workspace.id %}">
                                    {% csrf_token %}
                                    <button type="submit">X</button>
                                </form>

                            </li>
                        {% endfor %}
                    </ul>
                {% else %}
                    <p>Haven't existed any workspace yet</p>
                {% endif %}
            </section>
