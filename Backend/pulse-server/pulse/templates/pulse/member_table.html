<section class="panel">
                <h2>Members</h2>
                {% if member_list %}
                    <ul class="list">
                        {% for member in member_list %}
                            <li>
                                <a href="{% url 'pulse:profile' member.id %}">{{ member }}</a>
                            </li>
                        {% endfor %}
                    </ul>
                {% else %}
                    <p>Haven't joined any member yet</p>
                {% endif %}
            </section>
