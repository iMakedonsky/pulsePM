default_install_hook_types: [pre-commit, pre-push]
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: backend-check
        name: backend lint, format, types, and tests
        entry: make check-backend
        language: system
        pass_filenames: false
        files: ^(?i:backend)/|^(Makefile|\.pre-commit-config\.yaml)$
        stages: [pre-commit, pre-push]

      - id: frontend-check
        name: frontend lint, format, types, and tests
        entry: make check-frontend
        language: system
        pass_filenames: false
        files: ^frontend/|^(Makefile|\.pre-commit-config\.yaml)$
        stages: [pre-commit, pre-push]
